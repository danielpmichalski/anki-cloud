server {
    listen 80;
    root /usr/share/nginx/html;

    # config.js is generated at startup and must never be cached
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
