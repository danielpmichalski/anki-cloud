services:
  anki-sync-server:
    build:
      context: .
      dockerfile: Dockerfile.sync
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SYNC_BASE: /data
      SYNC_INTERNAL_PORT: 8081
      SYNC_INTERNAL_HOST: 0.0.0.0
      SYNC_INTERNAL_TOKEN: ${SIDECAR_TOKEN}
      DATABASE_URL: file:/data/anki-cloud.db
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - app-data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/anki-cloud.db
      SIDECAR_URL: http://anki-sync-server:8081
      SIDECAR_TOKEN: ${SIDECAR_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3001}
    volumes:
      - app-data:/data
    depends_on:
      - anki-sync-server

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    ports:
      - "3001:3001"
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: 3001
      API_URL: http://api:3000
      # OAuth discovery for connectors; the defaults suit local testing with MCP Inspector
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3001}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:3000}
    depends_on:
      - api

volumes:
  app-data:
